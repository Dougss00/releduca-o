<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quantitativos Educacionais</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>
<body>
  <header class="app-header">
    <div class="container py-4 py-lg-5">
      <div class="brand-panel">
        <img class="brand-logo" src="{{ url_for('static', path='/img/prefeitura-araci-educacao.png') }}" alt="Prefeitura de Araci — Secretaria de Educação">
        <div class="brand-divider" aria-hidden="true"></div>
        <div class="brand-copy">
          <p class="eyebrow mb-2">GESTÃO EDUCACIONAL</p>
          <h1 class="display-title mb-2">Quantitativos por estabelecimento</h1>
          <p class="slogan mb-0">Educação que transforma, dados que orientam.</p>
        </div>
      </div>
    </div>
  </header>

  <main class="container py-4 py-lg-5">
    <section class="card upload-card border-0 mb-4">
      <div class="card-body p-4">
        <form id="upload-form">
          <label for="file-input" class="drop-zone" id="drop-zone">
            <span class="upload-icon" aria-hidden="true">↑</span>
            <strong>Selecione ou arraste uma planilha</strong>
            <span id="file-label">Arquivo .xlsx ou .xls, até 15 MB</span>
            <input id="file-input" name="file" type="file" accept=".xlsx,.xls" hidden required>
          </label>
          <button class="btn btn-primary mt-3 px-4" id="submit-button" type="submit">Gerar quantitativos</button>
        </form>
        <div id="message" class="alert mt-3 mb-0 d-none" role="alert"></div>
      </div>
    </section>

    <section id="results" class="d-none" aria-live="polite">
      <div class="row g-3 mb-4" id="summary-cards"></div>
      <div class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-3 mb-3">
        <div>
          <h2 class="h5 mb-1">Relatório consolidado</h2>
          <p class="text-secondary small mb-0">Uma linha por estabelecimento, com séries e totais na horizontal.</p>
        </div>
        <button class="btn btn-download px-4" id="download-button" type="button">
          <span aria-hidden="true">↓</span> Baixar relatório em Excel
        </button>
      </div>
      <div class="card result-card border-0">
        <div class="card-body p-0">
          <div class="table-responsive table-wrap">
            <table class="table table-bordered align-middle mb-0" id="result-table"></table>
          </div>
        </div>
      </div>
      <p id="ignored-note" class="small text-secondary mt-2 mb-0"></p>
    </section>
  </main>

  <script src="{{ url_for('static', path='/js/app.js') }}"></script>
</body>
</html>
